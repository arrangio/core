name: CI Check

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  build:
    needs: [lint, static]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Download Dependencies
        run: go mod tidy
      - name: Build
        run: go build -v ./...

  static:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Download Dependencies
        run: go mod tidy
      - name: Run go vet
        run: go vet ./...
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Run go fmt
        run: go fmt ./...

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Test with Go CLI
        run: go test -v -race ./...

  security:
    needs: build
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...

  benchmark:
    name: Run Benchmarks
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./... | tee bench.txt

      - name: Store Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "go"
          output-file-path: "bench.txt"
          comment-on-alert: true
          fail-on-alert: false
          alert-threshold: "200%"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
